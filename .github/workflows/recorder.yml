name: macOS recorder
on:
  push:
    branches: [main]
    # macOS runners are slow and (on private repos) cost 10x, so only build when the recorder changes.
    paths: ["macos/**", ".github/workflows/recorder.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/recorder.yml"]

jobs:
  build:
    name: Build
    # Package.swift needs Swift 6.2 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path macos/afterword-capture
