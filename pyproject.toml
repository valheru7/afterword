[project]
name = "afterword"
version = "0.1.0"
description = "Free, local-first AI notes for meetings and job interviews: record, transcribe, summarize."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Jerica Wilson" }]
keywords = ["meeting notes", "interview", "transcription", "whisper", "claude", "ollama", "joplin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=0.70",
]

[project.urls]
Homepage = "https://github.com/valheru7/afterword"
Issues = "https://github.com/valheru7/afterword/issues"

[project.scripts]
afterword = "afterword.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
